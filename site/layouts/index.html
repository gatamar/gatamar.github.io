{{ define "main" }}
  <h1>{{ .Site.Title }}</h1>

  <h2>Recently updated</h2>
  <ul>
    {{ range first 10 (where .Site.RegularPages "Section" "posts").ByLastmod.Reverse }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        — {{ .Lastmod.Format "2006-01-02" }}
      </li>
    {{ end }}
  </ul>
{{ end }}
