{{ define "main" }}
  <h1>{{ .Title }}</h1>

  {{ $pages := .Pages.ByLastmod.Reverse }}
  <ul>
    {{ range $pages }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        — {{ .Lastmod.Format "2006-01-02" }}
        {{ with .Params.tags }}
          ·
          {{ range $i, $t := . }}
            {{ if $i }}, {{ end }}
            <a href="{{ "/tags/" | relURL }}{{ $t | urlize }}/">{{ $t }}</a>
          {{ end }}
        {{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
